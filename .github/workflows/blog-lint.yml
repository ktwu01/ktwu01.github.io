name: Blog Format Linter

on:
  push:
    paths:
      - '_posts/**.md'
      - '_data/language_links.json'
      - '_data/parity_baseline.json'
      - '_includes/language-switcher.html'
      - '_includes/masthead.html'
      - '_layouts/single.html'
      - '_sass/layout/_navigation.scss'
      - 'images/**'
      - 'scripts/generate_language_links.py'
      - 'scripts/generate_author_notes.py'
      - 'scripts/lint_blog_format.py'
      - 'scripts/check_bilingual_parity.py'
      - 'scripts/check_blog.py'
      - 'tests/**.py'
      - 'tests/fixtures/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/blog-lint.yml'
  pull_request:
    paths:
      - '_posts/**.md'
      - '_data/language_links.json'
      - '_data/parity_baseline.json'
      - '_includes/language-switcher.html'
      - '_includes/masthead.html'
      - '_layouts/single.html'
      - '_sass/layout/_navigation.scss'
      - 'images/**'
      - 'scripts/generate_language_links.py'
      - 'scripts/generate_author_notes.py'
      - 'scripts/lint_blog_format.py'
      - 'scripts/check_bilingual_parity.py'
      - 'scripts/check_blog.py'
      - 'tests/**.py'
      - 'tests/fixtures/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/blog-lint.yml'
  workflow_dispatch: # Allow manual runs

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check blog content
        run: python3 scripts/check_blog.py --check

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Summarize blog coverage
        run: python3 scripts/check_blog.py --check --summary
